<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Discipline Fit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Manrope:wght@400;600;800&display=swap">
<style>
:root{--bg:#F3F5EE;--card:#FFFFFF;--ink:#0C1B2A;--mut:#5F6E7C;--ac:#1F5BFF;--acs:#E3EBFF;--am:#FFB400;--ok:#0E9F6E;--line:#DCE2D6;--hero:#0C1B2A;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1220;--card:#121C30;--ink:#EAF0FF;--mut:#93A1B8;--ac:#6C93FF;--acs:#1F2E55;--ok:#34D399;--line:#243250;--hero:#1B2A4A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1220;--card:#121C30;--ink:#EAF0FF;--mut:#93A1B8;--ac:#6C93FF;--acs:#1F2E55;--ok:#34D399;--line:#243250;--hero:#1B2A4A;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Manrope,system-ui,sans-serif}
main{max-width:480px;margin:0 auto;padding:18px 14px 120px}
h1,h2,.d{font-family:Unbounded,Manrope,system-ui,sans-serif;letter-spacing:-.02em;margin:0}
h1{font-size:26px;font-weight:800}
h2{font-size:15px;font-weight:500;margin-bottom:12px}
.sub{color:var(--mut);margin:4px 0 16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:12px}
.hero{background:var(--hero);color:#fff;border:0;display:flex;align-items:center;gap:16px}
.hero .mut{color:#B8C4D6}
.ring{position:relative;width:124px;height:124px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font:800 26px Unbounded,sans-serif}
.ring .n small{display:block;font:600 11px Manrope;color:#B8C4D6}
.big{font:800 32px/1 Unbounded,sans-serif}
.mut{color:var(--mut);font-size:13px}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;margin-bottom:8px;border-radius:16px;background:var(--bg)}
.row .t{flex:1;min-width:0}
.row .t b{font-weight:600;display:block;overflow-wrap:anywhere}
.chk{width:32px;height:32px;border-radius:10px;border:2px solid var(--mut);background:transparent;color:#fff;font-size:17px;flex:none;cursor:pointer}
.chk.on{background:var(--ok);border-color:var(--ok)}
.cnt{display:flex;align-items:center;gap:6px}
.cnt button{width:32px;height:32px;border-radius:10px;border:0;background:var(--acs);color:var(--ink);font-size:18px;cursor:pointer}
.cnt span{min-width:42px;text-align:center;font-weight:800;font-size:14px}
.x{background:none;border:0;color:var(--mut);font-size:20px;padding:2px 6px;cursor:pointer}
input,select{width:100%;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin-bottom:8px}
label{display:block;font-size:12px;color:var(--mut);margin:0 0 3px 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{width:100%;padding:14px;border-radius:14px;border:0;background:var(--ac);color:#fff;font:800 15px Manrope,sans-serif;cursor:pointer}
.btn.alt{background:var(--acs);color:var(--ink)}
.btn.am{background:var(--am);color:#0C1B2A}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
nav div{pointer-events:auto;display:flex;width:100%;max-width:456px;gap:2px;background:var(--hero);padding:6px;border-radius:22px}
nav button{flex:1;border:0;background:none;color:#B8C4D6;padding:7px 0;border-radius:16px;font:600 11px Manrope,sans-serif;cursor:pointer}
nav button span{display:block;font-size:19px}
nav button.on{background:var(--ac);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 12px;font:600 13px Manrope,sans-serif;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;border-radius:8px 8px 3px 3px;background:var(--ac);min-height:4px;margin-bottom:4px}
.bars i.low{background:var(--line)}
.pb{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.pb i{display:block;height:100%;background:var(--am);border-radius:6px}
.empty{color:var(--mut);padding:6px 0}
.meal{padding:12px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.meal b{display:flex;justify-content:space-between;gap:8px}
.macro{text-align:center;background:var(--bg);border-radius:16px;padding:12px 4px}
.macro .big{font-size:20px}
.note{font-size:12px;color:var(--mut);margin-top:8px}
.scroll{overflow-x:auto}
canvas#cv{width:100%;height:260px;display:block;border-radius:18px;background:var(--bg);touch-action:pan-y;cursor:grab;margin-bottom:6px}
input.pin{width:78px;margin:0;padding:8px;flex:none}
@media (prefers-reduced-motion:no-preference){.ring circle.v,.pb i{transition:all .5s ease}}
</style>
</head>
<body>
<main id="app"></main>
<nav><div id="tabs"></div></nav>
<script>
var KEY='discipline-fit-v1',TH=0.8;
var DEF={habits:[{id:'h1',name:'Workout',t:1},{id:'h2',name:'Drink water (glasses)',t:8},{id:'h3',name:'Wake up on time',t:1},{id:'h4',name:'No junk food',t:1},{id:'h5',name:'Read 20 minutes',t:1},{id:'h6',name:'Sleep before 11 pm',t:1}],logs:{},workouts:[],weights:[],goal:null};

function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function ago(n){var d=new Date();d.setDate(d.getDate()-n);return d}

function $v(id){return document.getElementById(id).value}

function ring(p){var c=2*Math.PI*50;return '<div class="ring"><svg width="124" height="124" viewBox="0 0 124 124"><circle cx="62" cy="62" r="50" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="12"/><circle class="v" cx="62" cy="62" r="50" fill="none" stroke="#FFB400" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-p))+'"/></svg><div class="n">'+Math.round(p*100)+'%<small>habits</small></div></div>'}
function stepBox(){var k=dk(new Date()),s=steps(k);return '<div class="card"><h2>Steps</h2><div class="big"><span id="stc">'+s.toLocaleString()+'</span> <span class="mut">/ '+S.stepGoal.toLocaleString()+'</span></div><div class="pb"><i id="stb" style="width:'+Math.min(100,s/S.stepGoal*100)+'%"></i></div></div>'}
function vToday(){
var k=dk(new Date()),p=score(k),st=streak();
var m=p>=TH?'Done for today. Keep the chain going.':(p>0?'Finish strong. Every habit counts.':'Start with one habit. Momentum follows.');
var h='<h1>Today</h1><p class="sub">'+new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})+'</p>';
h+='<div class="card hero">'+ring(p)+'<div><div class="big">'+st+'</div><div class="mut">day streak</div><p class="mut" style="margin:10px 0 0">'+m+'</p></div></div>'+stepBox();
h+='<div class="card"><h2>Daily habits</h2>';
if(!S.habits.length)h+='<div class="empty">No habits yet. Add one below.</div>';
S.habits.forEach(function(x){var v=val(k,x.id);
h+='<div class="row"><div class="t"><b>'+esc(x.name)+'</b></div>';

else h+='<button class="chk'+(v>=1?' on':'')+'" data-a="tog" data-id="'+x.id+'" aria-label="Mark done">'+(v>=1?'✓':'')+'</button>';

h+=demoBox();h+='<label for="wn">Exercise name</label><input id="wn" value="'+esc(sel)+'" placeholder="Tap one above or type your own" maxlength="40"><div class="g3"><div><label for="ws">Sets</label><input id="ws" type="number" min="1" placeholder="3"></div><div><label for="wr">Reps</label><input id="wr" type="number" min="1" placeholder="12"></div><div><label for="wm">Minutes</label><input id="wm" type="number" min="1" placeholder="20"></div></div><button class="btn" data-a="addw">Log exercise</button></div><div class="card"><h2>Recent exercises</h2>';

function vSteps(){

var h='<h1>Steps</h1><p class="sub">Walk more. It adds up.</p><div class="card hero" style="display:block"><div class="mut">Today</div><div class="big" style="font-size:44px;margin:6px 0"><span id="stc">'+s.toLocaleString()+'</span></div><div class="pb"><i id="stb" style="width:'+Math.min(100,s/S.stepGoal*100)+'%"></i></div><div class="mut">Goal '+S.stepGoal.toLocaleString()+' steps · '+km+' km · ~'+kc+' kcal</div></div>';
h+='<div class="card"><h2>Step counter</h2><button class="btn'+(sensor.on?' alt':'')+'" data-a="'+(sensor.on?'sstop':'sstart')+'">'+(sensor.on?'Stop counting':'Start counting')+'</button><p class="note">'+(msg||(sensor.on?'Counting. Keep this page open and your phone with you.':'Uses your phone’s motion sensor. It only counts while this page is open and the screen is on. Add steps by hand if it misses any.'))+'</p></div>';
h+=mapCard();h+='<div class="card"><h2>Add steps by hand</h2><div class="g2"><input id="sa" type="number" min="1" placeholder="e.g. 2000"><button class="btn alt" data-a="sadd" style="margin-bottom:8px">Add</button></div><label for="sg">Daily step goal</label><div class="g2"><input id="sg" type="number" min="1000" step="500" value="'+S.stepGoal+'"><button class="btn alt" data-a="sgoal" style="margin-bottom:8px">Save goal</button></div></div>';

function plan(){
